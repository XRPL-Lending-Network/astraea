[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/XRPL-Lending-Network/astraea"
# No crate in this workspace goes to crates.io. Publishing anything is a
# separate, deliberate decision, and this line keeps it from happening by
# accident: `cargo publish` will refuse.
publish = false

[workspace.dependencies]
witness-core = { path = "crates/witness-core" }
witness-store = { path = "crates/witness-store" }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "net"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
ureq = "3"

[workspace.lints.rust]
# Unsafe code is forbidden across the whole project. If it is ever needed,
# lift the ban narrowly, for one specific module, with a note explaining why.
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# In code that parses untrusted data, a panic is a denial of service.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
