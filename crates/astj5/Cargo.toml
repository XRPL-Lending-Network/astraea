# ASTJ: the codec of Astraea's cold history. See docs/architecture.md for what
# the format does and docs/running.md for rewriting older segments.
[package]
name = "astraea-journal-codec"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "ISC"
publish = false
[dependencies]
witness-core = { path = "../witness-core" }
zstd = "0.14.3"
k256 = { version = "0.14", features = ["ecdsa"] }
sha2 = "0.10"
