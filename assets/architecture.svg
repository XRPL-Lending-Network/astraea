<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
  <title id="t">How Astraea fits together</title>
  <desc id="d">Ledgers come from xrpld and the XRPLA archive, validations and UNL lists come from the network. The Ledger Engine checks and stores ledgers, the Proof Engine confirms them by validator quorum, and both feed the Clio-compatible API and the Proof API.</desc>
  <style>
    .serif { font-family: 'Tiempos Headline','Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif; }
    .sans { font-family: Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; }
    @media (prefers-reduced-motion: reduce) { .m { animation: none !important; } }
</style>
  <rect width="1000" height="560" rx="16" fill="#0a0a0a"/>
  <rect x=".5" y=".5" width="999" height="559" rx="15.5" fill="none" stroke="#1d1d1d"/>
  <text x="40" y="58" class="sans" font-size="11" font-weight="600" letter-spacing="2.4" fill="#8b8b8b">SOURCES</text><text x="350" y="58" class="sans" font-size="11" font-weight="600" letter-spacing="2.4" fill="#8b8b8b">ASTRAEA</text><text x="740" y="58" class="sans" font-size="11" font-weight="600" letter-spacing="2.4" fill="#8b8b8b">WHAT CLIENTS GET</text>
  <path id="w1" d="M260 130 C305 130 305 150 350 150" fill="none" stroke="#2a2a2a" stroke-width="1.4"/><path id="w2" d="M260 240 C305 240 305 220 350 220" fill="none" stroke="#2a2a2a" stroke-width="1.4"/><path id="w3" d="M260 370 C305 370 305 390 350 390" fill="none" stroke="#2a2a2a" stroke-width="1.4"/><path id="w4" d="M260 480 C305 480 305 460 350 460" fill="none" stroke="#2a2a2a" stroke-width="1.4"/><path id="w5" d="M500 326 L500 284" fill="none" stroke="#2a2a2a" stroke-width="1.4"/><path id="w6" d="M650 175 L740 175" fill="none" stroke="#2a2a2a" stroke-width="1.4"/><path id="w7" d="M650 435 L740 435" fill="none" stroke="#2a2a2a" stroke-width="1.4"/><path id="w8" d="M650 250 C700 250 690 405 740 405" fill="none" stroke="#2a2a2a" stroke-width="1.4"/>
  <rect x="40" y="86" width="220" height="88" rx="6" fill="#111111" stroke="#262626"/><circle cx="60" cy="111" r="4" fill="#3b82f6"/><text x="72" y="116" class="sans" font-size="15" font-weight="600" fill="#f5f5f4">xrpld (gRPC)</text><text x="58" y="140" class="sans" font-size="12.5" fill="#8b8b8b">validated ledgers</text><text x="58" y="159" class="sans" font-size="12.5" fill="#8b8b8b">with state changes</text><rect x="40" y="196" width="220" height="88" rx="6" fill="#111111" stroke="#262626"/><circle cx="60" cy="221" r="4" fill="#8b5cf6"/><text x="72" y="226" class="sans" font-size="15" font-weight="600" fill="#f5f5f4">XRPLA archive</text><text x="58" y="250" class="sans" font-size="12.5" fill="#8b8b8b">full history from</text><text x="58" y="269" class="sans" font-size="12.5" fill="#8b8b8b">ledger 32,571</text><rect x="40" y="326" width="220" height="88" rx="6" fill="#111111" stroke="#262626"/><circle cx="60" cy="351" r="4" fill="#facc15"/><text x="72" y="356" class="sans" font-size="15" font-weight="600" fill="#f5f5f4">Validations stream</text><text x="58" y="380" class="sans" font-size="12.5" fill="#8b8b8b">signed votes</text><text x="58" y="399" class="sans" font-size="12.5" fill="#8b8b8b">from validators</text><rect x="40" y="436" width="220" height="88" rx="6" fill="#111111" stroke="#262626"/><circle cx="60" cy="461" r="4" fill="#d946ef"/><text x="72" y="466" class="sans" font-size="15" font-weight="600" fill="#f5f5f4">UNL publishers</text><text x="58" y="490" class="sans" font-size="12.5" fill="#8b8b8b">vl.ripple.com</text><text x="58" y="509" class="sans" font-size="12.5" fill="#8b8b8b">unl.xrplf.org</text><rect x="350" y="86" width="300" height="198" rx="6" fill="#111111" stroke="#2c3d31"/><text x="368" y="116" class="serif" font-size="19" font-weight="600" fill="#f5f5f4">Ledger Engine</text><text x="368" y="140" class="sans" font-size="12.5" fill="#8b8b8b">tx tree must match the header root</text><text x="368" y="159" class="sans" font-size="12.5" fill="#8b8b8b">parent hash chain, state root per ledger</text><text x="368" y="178" class="sans" font-size="12.5" fill="#8b8b8b"></text><text x="368" y="197" class="sans" font-size="12.5" fill="#8b8b8b">hot store: recent ledgers and state</text><text x="368" y="216" class="sans" font-size="12.5" fill="#8b8b8b">cold store: ASTJ5 segments,</text><text x="368" y="235" class="sans" font-size="12.5" fill="#8b8b8b">about 240 bytes per transaction</text><rect x="350" y="326" width="300" height="198" rx="6" fill="#111111" stroke="#2c3d31"/><text x="368" y="356" class="serif" font-size="19" font-weight="600" fill="#f5f5f4">Proof Engine</text><text x="368" y="380" class="sans" font-size="12.5" fill="#8b8b8b">every signature checked on arrival</text><text x="368" y="399" class="sans" font-size="12.5" fill="#8b8b8b">UNL in force at the ledger's time</text><text x="368" y="418" class="sans" font-size="12.5" fill="#8b8b8b"></text><text x="368" y="437" class="sans" font-size="12.5" fill="#8b8b8b">80% of the full UNL, for every</text><text x="368" y="456" class="sans" font-size="12.5" fill="#8b8b8b">list combination that applies,</text><text x="368" y="475" class="sans" font-size="12.5" fill="#8b8b8b">or the ledger is not served</text><rect x="740" y="120" width="220" height="110" rx="6" fill="#111111" stroke="#3a3a3a"/><text x="758" y="150" class="sans" font-size="15" font-weight="600" fill="#f5f5f4">Clio-compatible API</text><text x="758" y="174" class="sans" font-size="12.5" fill="#8b8b8b">JSON-RPC and WebSocket</text><text x="758" y="193" class="sans" font-size="12.5" fill="#8b8b8b">tx, account_tx, ledger, ...</text><rect x="740" y="380" width="220" height="110" rx="6" fill="#111111" stroke="#3a3a3a"/><text x="758" y="410" class="sans" font-size="15" font-weight="600" fill="#f5f5f4">Proof API</text><text x="758" y="434" class="sans" font-size="12.5" fill="#8b8b8b">evidence packages that</text><text x="758" y="453" class="sans" font-size="12.5" fill="#8b8b8b">anyone can verify offline</text>
  <circle r="3.2" fill="#3b82f6"><animateMotion dur="2.0s" begin="0s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle><circle r="3.2" fill="#8b5cf6"><animateMotion dur="2.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle><circle r="3.2" fill="#facc15"><animateMotion dur="1.5s" begin="0s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle><circle r="3.2" fill="#facc15"><animateMotion dur="1.5s" begin="0.8s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle><circle r="3.2" fill="#d946ef"><animateMotion dur="3.0s" begin="0.5s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle><circle r="3.2" fill="#22c55e"><animateMotion dur="1.4s" begin="0.3s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle><circle r="3.2" fill="#f5f5f4"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite"><mpath href="#w6"/></animateMotion></circle><circle r="3.2" fill="#f5f5f4"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#w6"/></animateMotion></circle><circle r="3.2" fill="#f5f5f4"><animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite"><mpath href="#w7"/></animateMotion></circle><circle r="3.2" fill="#b9c4a8"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite"><mpath href="#w8"/></animateMotion></circle>
</svg>
