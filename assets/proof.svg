le" class="mono" font-size="11" fill="#f5f5f4">N+2</text><rect x="576" y="150" width="56" height="40" rx="4" fill="#161616" stroke="#22c55e"/><text x="604" y="174" text-anchor="middle" class="mono" font-size="11" fill="#f5f5f4">anchor</text><path d="M440 170 L430 170 M435 166 L430 170 L435 174" stroke="#3a3a3a" stroke-width="1.2" fill="none"/><path d="M508 170 L498 170 M503 166 L498 170 L503 174" stroke="#3a3a3a" stroke-width="1.2" fill="none"/><path d="M576 170 L566 170 M571 166 L566 170 L571 174" stroke="#3a3a3a" stroke-width="1.2" fill="none"/><rect x="508" y="150" width="56" height="40" rx="4" fill="none" stroke="#22c55e" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.4;1;1" dur="9.0s" repeatCount="indefinite"/></rect><rect x="440" y="150" width="56" height="40" rx="4" fill="none" stroke="#22c55e" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.4;1;1" dur="9.0s" repeatCount="indefinite"/></rect><rect x="372" y="150" width="56" height="40" rx="4" fill="none" stroke="#22c55e" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.5;1;1" dur="9.0s" repeatCount="indefinite"/></rect><path d="M604 204 L400 204" stroke="#22c55e" stroke-width="2" stroke-dasharray="204" stroke-dashoffset="204" fill="none"><animate attributeName="stroke-dashoffset" values="204;204;0;0;204" keyTimes="0;0.4;0.5;1;1" dur="9.0s" repeatCount="indefinite"/></path><text x="372" y="236" class="mono" font-size="11" fill="#8b8b8b">parent_hash(N+1) = hash(N)</text><text x="372" y="279" class="sans" font-size="13" fill="#8b8b8b">at most 512 headers per package</text><rect x="676" y="24" width="300" height="282" rx="6" fill="#111111" stroke="#262626"/><text x="698" y="56" class="mono" font-size="11" fill="#8b8b8b" letter-spacing="1.5">03</text><text x="698" y="84" class="serif" font-size="21" fill="#f5f5f4">Transaction in the tree</text><text x="698" y="106" class="sans" font-size="12.5" fill="#8b8b8b">sibl