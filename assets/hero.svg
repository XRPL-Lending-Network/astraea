<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
  <title id="t">Astraea</title>
  <desc id="d">XRPL history you can check yourself. A dotted globe turns slowly while ledgers climb its meridians to the pole, where validators agree on them.</desc>
  <style>
    .serif { font-family: 'Tiempos Headline','Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif; }
    .sans { font-family: Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; }
    @media (prefers-reduced-motion: reduce) { .m { animation: none !important; } }

    .wire { fill: none; stroke: url(#globe); stroke-width: .7; opacity: .3; }
    .dots { fill: none; stroke: url(#globe); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 0 14; animation: crawl 3.5s linear infinite; }
    @keyframes crawl { to { stroke-dashoffset: -28; } }
  </style>
  <defs>
    <linearGradient id="globe" gradientUnits="userSpaceOnUse" x1="605" y1="0" x2="1205" y2="0">
      <stop offset=".1" stop-color="#d8a7b8"/>
      <stop offset=".55" stop-color="#b9c4a8"/>
      <stop offset=".95" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="glow" cx="905" cy="200" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="460" rx="16"/></clipPath>
