      <stop offset=".55" stop-color="#b9c4a8"/>
      <stop offset=".95" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="glow" cx="905" cy="225" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="480" rx="16"/></clipPath>
