# cargo-deny: what dependencies may come in. Run `cargo deny check`; CI runs it too.

[graph]
all-features = false

[advisories]
# Known vulnerabilities and unmaintained crates from the RustSec database fail the
# check. An entry here needs a reason next to it.
ignore = []

[licenses]
# Permissive licenses only, so that Astraea itself can stay ISC. A dependency
# offered under several licenses passes if one of them is on this list (for
# example self_cell, Apache-2.0 OR GPL-2.0-only).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# Two versions of one crate cost build time, not correctness: reported, not fatal.
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path; none of them is published.
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
